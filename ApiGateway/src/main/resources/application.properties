spring.application.name=ApiGateway

spring.cloud.gateway.routes[0].id=USER-MANAGEMENT-SYSTEM
spring.cloud.gateway.routes[0].uri=lb://USER-MANAGEMENT-SYSTEM
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[1].id=RATING-MANAGEMENT-SYSTEM
spring.cloud.gateway.routes[1].uri=lb://RATING-MANAGEMENT-SYSTEM
spring.cloud.gateway.routes[1].predicates[0]=Path=/ratings/**

spring.cloud.gateway.routes[2].id=HOTEL-MANAGEMENT-SYSTEM
spring.cloud.gateway.routes[2].uri=lb://HOTEL-MANAGEMENT-SYSTEM
spring.cloud.gateway.routes[2].predicates[0]=Path=/hotel/**

server.port=9090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true